<title>Rastlinjak</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;1,6..72,300;1,6..72,400&family=JetBrains+Mono:wght@400;600&display=swap');

*, *::before, *::after { box-sizing: border-box; }

:root {
  --ink:#1E2A24; --ink-soft:#5A6A60; --paper:#F1F0E8; --card:#FBFAF5;
  --line:#CFCEC0; --water:#2F6072; --feed:#9A7420; --alarm:#94382C; --leaf:#4A7358;
}

body {
  margin:0; font-family:'Newsreader',Georgia,serif; background:var(--paper); color:var(--ink);
  padding:0 0 90px; -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent;
}
.wrap { max-width:760px; margin:0 auto; padding:0 18px; }

header {
  border-bottom:1px solid var(--line); padding:calc(24px + env(safe-area-inset-top)) 0 16px;
  display:flex; align-items:baseline; justify-content:space-between; gap:14px;
}
h1 {
  font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:30px;
  letter-spacing:.14em; text-transform:uppercase; margin:0; line-height:1;
}
.season {
  font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:.1em;
  text-transform:uppercase; color:var(--ink-soft); text-align:right; line-height:1.7; white-space:nowrap;
}

.card {
  background:var(--card); border:1px solid var(--line); border-left:3px solid var(--leaf);
  border-radius:2px; padding:14px; margin-bottom:12px;
}
.card.now  { border-left-color:var(--water); }
.card.late { border-left-color:var(--alarm); }
.card.soon { border-left-color:var(--feed); }

.top { display:flex; gap:14px; align-items:flex-start; cursor:pointer; }

.picwrap { flex:0 0 45%; display:flex; flex-direction:column; gap:8px; }
.cinfo { flex:1; min-width:0; display:flex; flex-direction:column; gap:5px; padding-top:2px; }

.nm { font-family:'Barlow Condensed',sans-serif; font-weight:600; font-size:19px; letter-spacing:.07em; text-transform:uppercase; line-height:1.1; margin:0; }
.lat { font-style:italic; font-size:13px; color:var(--ink-soft); margin:0; }
.tagline { font-family:'Newsreader',serif; font-style:italic; font-size:13px; line-height:1.45; color:var(--leaf); margin:4px 0 0; }

.stats { display:flex; flex-wrap:wrap; gap:6px; }
.stat {
  display:inline-block; font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.03em;
  padding:3px 9px; border-radius:20px; white-space:nowrap;
}
.stat.ok   { background:rgba(90,106,96,.12);   color:var(--ink-soft); }
.stat.soon { background:rgba(154,116,32,.14);  color:var(--feed); font-weight:600; }
.stat.now  { background:rgba(47,96,114,.14);   color:var(--water); font-weight:600; }
.stat.late { background:rgba(148,56,44,.14);   color:var(--alarm); font-weight:700; }

.card-acts { display:flex; justify-content:flex-end; margin-top:10px; }

.btn {
  font-family:'Barlow Condensed',sans-serif; font-size:13px; font-weight:600; letter-spacing:.09em;
  text-transform:uppercase; border:1px solid var(--water); color:var(--water); background:none;
  border-radius:2px; padding:9px 13px; cursor:pointer; white-space:nowrap;
}
.btn.feed { border-color:var(--feed); color:var(--feed); }
.btn.plain { border-color:var(--line); color:var(--ink-soft); }
.btn.danger { border-color:var(--alarm); color:var(--alarm); }
.btn:active { background:var(--ink); color:var(--paper); border-color:var(--ink); }

.link {
  background:none; border:none; padding:6px 2px; cursor:pointer;
  font-family:'Barlow Condensed',sans-serif; font-size:12.5px; font-weight:600; letter-spacing:.07em;
  text-transform:uppercase; color:var(--ink-soft); text-decoration:underline; text-underline-offset:3px;
  white-space:nowrap;
}
.link:active { color:var(--ink); }

.sec {
  font-family:'Barlow Condensed',sans-serif; font-size:13px; font-weight:600; letter-spacing:.16em;
  text-transform:uppercase; color:var(--ink-soft); margin:26px 0 11px; padding-bottom:6px;
  border-bottom:1px solid var(--line);
}
.empty { font-style:italic; color:var(--ink-soft); font-size:15px; padding:16px 0; line-height:1.5; }

.veil { position:fixed; inset:0; background:rgba(30,42,36,.55); display:flex; align-items:flex-end; justify-content:center; z-index:40; padding-top:24px; }
.sheet {
  background:var(--card); width:100%; max-width:760px; border-radius:6px 6px 0 0;
  border:1px solid var(--line); border-bottom:none; max-height:92vh; overflow-y:auto;
  padding:22px 20px calc(46px + env(safe-area-inset-bottom));
  -webkit-overflow-scrolling:touch;
}
.close {
  float:right; background:none; border:none; cursor:pointer; font-family:'JetBrains Mono',monospace;
  font-size:12px; letter-spacing:.1em; color:var(--ink-soft); text-transform:uppercase; padding:4px;
}
.fact { border-top:1px solid var(--line); padding:12px 0; }
.fact dt { font-family:'Barlow Condensed',sans-serif; font-size:12px; font-weight:600; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-soft); margin-bottom:4px; }
.fact dd { margin:0; font-size:15.5px; line-height:1.55; }
.sub { color:var(--ink-soft); font-size:13.5px; }

.warn { background:#F6EDE9; border-left:3px solid var(--alarm); padding:10px 12px; font-size:14.5px; line-height:1.5; margin:14px 0 0; }
.warn.blue { background:#E9EFF2; border-left-color:var(--water); }

input, select, textarea {
  font-family:'Newsreader',serif; font-size:16px; width:100%; padding:10px;
  border:1px solid var(--line); border-radius:2px; background:#fff; color:var(--ink); margin-bottom:10px;
}
textarea { resize:vertical; }
.lbl { font-family:'Barlow Condensed',sans-serif; font-size:12px; font-weight:600; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-soft); display:block; margin-bottom:4px; }
.log { font-family:'JetBrains Mono',monospace; font-size:11.5px; color:var(--ink-soft); line-height:1.9; }
:focus-visible { outline:2px solid var(--water); outline-offset:2px; }


.cpic {
  width:100%; aspect-ratio:1/1; object-fit:cover; border-radius:3px;
  border:1px solid var(--line); display:block; background:var(--paper);
}
.cpic.none {
  aspect-ratio:1/1; border-style:dashed; display:flex; align-items:center; justify-content:center;
  color:var(--line); font-size:44px;
}
.hero { width:100%; max-height:280px; object-fit:cover; border-radius:3px; border:1px solid var(--line); margin:14px 0 4px; display:block; }

.hist { display:flex; flex-direction:column; gap:12px; }
.hist-item { display:flex; gap:10px; align-items:flex-start; cursor:pointer; }
.hist-item img { width:56px; height:56px; object-fit:cover; border-radius:3px; border:1px solid var(--line); display:block; flex:0 0 56px; }
.hist-d { font-family:'JetBrains Mono',monospace; font-size:10.5px; color:var(--ink-soft); letter-spacing:.04em; }
.hist-n { margin:3px 0 0; font-size:14px; line-height:1.45; }

@media (max-width:520px){
  .card { padding:11px; }
  .top { gap:10px; }
  h1 { font-size:25px; }
}

},
{

},

  id:"strelicija", name:"Strelicija", latin:"Strelitzia sp.", tag:"na okenski polici",
  wg:7, wr:14, fd:14,
  voda:"Zalij temeljito, potem pusti, da se zgornja tretjina substrata posuši — poleti približno na teden dni, pozimi na dva. Krožnik vedno izprazni: kratko sušo prenese veliko bolje kot stalno mokre korenine.",

  svetloba:"Direktno sonce je zaželeno — južno ali zahodno okno. Brez nekaj ur direktne svetlobe na dan ne bo nikoli zacvetela. Na polno sonce jo navajaj postopno, teden ali dva, sicer dobi ožige.",

{

const KEY = "rastlinjak-v1";
const $ = (s, r=document) => r.querySelector(s);
const MON = ["jan.","feb.","mar.","apr.","maj","jun.","jul.","avg.","sep.","okt.","nov.","dec."];

const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const today = () => iso(new Date());
const pretty = s => { if(!s) return "—"; const d=new Date(s+"T00:00:00"); return `${d.getDate()}. ${MON[d.getMonth()]}`; };
const diff = (a,b) => a ? Math.round((new Date(b+"T00:00:00") - new Date(a+"T00:00:00"))/86400000) : null;
const growing = () => { const m = new Date().getMonth()+1; return m>=4 && m<=9; };

function plural(n,a,b,c,d){ const x=Math.abs(n)%100; if(x===1)return a; if(x===2)return b; if(x===3||x===4)return c; return d; }
const dw = n => plural(n,"dan","dneva","dni","dni");
const pw = n => plural(n,"rastlina","rastlini","rastline","rastlin");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

let plants = load();
let pendingShot = null;

function load(){
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) { const d = JSON.parse(raw); if (Array.isArray(d) && d.length) return d; }
  } catch(e){}
  return SEED.map(p => ({...p}));
}
function save(){
  try { localStorage.setItem(KEY, JSON.stringify(plants)); return true; }
  catch(e){ console.error("shranjevanje", e); return false; }
}

function status(p){
  const iv = growing() ? p.wg : p.wr;
  const since = diff(p.lastWater, today());
  if (since === null) return { iv, since:null, due:-999, cls:"now" };
  const due = iv - since;
  let cls = "ok";
  if (due <= 0) cls = "now";
  else if (due <= 1) cls = "soon";
  if (due <= -3) cls = "late";
  return { iv, since, due, cls };
}
function fert(p){
  if (!p.fd || !growing()) return null;
  const since = diff(p.lastFert, today());
  return { since, due: since === null ? 0 : p.fd - since };
}

function waterLabel(s){
  if (s.since === null) return { cls:"now", txt:"ni vpisa zalivanja" };
  if (s.cls === "late") return { cls:"late", txt:`nujno zalij · zamuja ${Math.abs(s.due)} ${dw(Math.abs(s.due))}` };
  if (s.cls === "now")  return { cls:"now",  txt:"zalij danes" };
  if (s.cls === "soon") return { cls:"soon", txt:`zalij čez ${s.due} ${dw(s.due)}` };
  return { cls:"ok", txt:`zalito · še ${s.due} ${dw(s.due)}` };
}
function fertLabel(p){
  const f = fert(p);
  if (!f) return null;
  if (f.since === null) return { cls:"now", txt:"ni vpisa gnojenja" };
  let cls = "ok";
  if (f.due <= 0) cls = "now";
  else if (f.due <= 1) cls = "soon";
  if (f.due <= -3) cls = "late";
  if (cls === "late") return { cls, txt:`nujno pognoji · zamuja ${Math.abs(f.due)} ${dw(Math.abs(f.due))}` };
  if (cls === "now")  return { cls, txt:"pognoji danes" };
  if (cls === "soon") return { cls, txt:`pognoji čez ${f.due} ${dw(f.due)}` };
  return { cls, txt:`pognojeno · še ${f.due} ${dw(f.due)}` };
}

function cardHTML(p){
  const s = status(p);
  const w = waterLabel(s);
  const fl = fertLabel(p);
  const shot = p.photos && p.photos.length ? p.photos[0].src : null;

  return `<div class="card ${s.cls}">
    <div class="top" data-open="${p.id}">
      <div class="picwrap">
        ${shot ? `<img class="cpic" src="${shot}" alt="">` : `<div class="cpic none">❧</div>`}
        <div class="stats">
          <span class="stat ${w.cls}">${w.txt}</span>
          ${fl ? `<span class="stat ${fl.cls}">${fl.txt}</span>` : ""}
        </div>
      </div>
      <div class="cinfo">
        <h3 class="nm">${esc(p.name)}</h3>
        <p class="lat">${p.hydro ? "v vodi · menjaj vsak teden" : esc(p.latin)}</p>
        ${p.zanimivost ? `<p class="tagline">${esc(p.zanimivost)}</p>` : ""}
      </div>
    </div>
    <div class="card-acts">
      <button class="link" data-status="${p.id}">+ status</button>
    </div>
  </div>`;
}

function render(){
  $("#season").innerHTML = `${growing()?"Rastna doba":"Mirovanje"}<br>${plants.length} ${pw(plants.length)}`;
  const list = [...plants].sort((a,b) => status(a).due - status(b).due);
  $("#view").innerHTML = list.map(cardHTML).join("") +
    `<button class="btn plain" data-add="1" style="margin-top:6px">+ Dodaj rastlino</button>`;
}

function detail(id){
  const p = plants.find(x => x.id === id);
  if (!p) return;
  const s = status(p), f = fert(p);
  $("#modal").innerHTML = `<div class="veil" data-veil="1"><div class="sheet">
    <button class="close" data-close="1">Zapri ✕</button>
    <h2 class="nm" style="font-size:25px">${esc(p.name)}</h2>
    <p class="lat" style="font-size:15px">${esc(p.latin)}${p.tag?" · "+esc(p.tag):""}</p>
    ${p.photos && p.photos.length ? `<img class="hero" src="${p.photos[0].src}" alt="${esc(p.name)}">` : ""}
    <div style="display:flex;align-items:center;gap:8px;margin:16px 0 4px;flex-wrap:wrap">
      <button class="btn" data-water="${p.id}">${p.hydro?"Menjal vodo danes":"Zalil danes"}</button>
      ${p.fd ? `<button class="btn feed" data-feed="${p.id}">Pognojil danes</button>` : ""}
      <button class="link" style="margin-left:auto" data-status="${p.id}">+ Dodaj status</button>
      <button class="link" data-edit="${p.id}">Uredi</button>
    </div>
    ${p.photos && p.photos.length ? `<h3 class="sec">Zgodovina razvoja</h3><div class="hist">${p.photos.map((ph,i)=>`
      <div class="hist-item" data-shot="${p.id}|${i}">
        <img src="${ph.src}" alt="">
        <div><span class="hist-d">${pretty(ph.d)}</span>${ph.note?`<p class="hist-n">${esc(ph.note)}</p>`:""}</div>
      </div>`).join("")}</div>` : ""}
    <dl style="margin:18px 0 0">
      <div class="fact"><dt>Voda</dt><dd>${esc(p.voda)}<br>
        <span class="sub">Ritem zdaj: na ${s.iv} ${dw(s.iv)} · nazadnje ${pretty(p.lastWater)}${s.since!==null?` (pred ${s.since} ${dw(s.since)})`:""}</span></dd></div>
      <div class="fact"><dt>Zemlja</dt><dd>${esc(p.zemlja)}</dd></div>
      <div class="fact"><dt>Gnojilo</dt><dd>${esc(p.gnojilo)}${p.fd?`<br><span class="sub">Nazadnje ${pretty(p.lastFert)}${f&&f.since!==null?` (pred ${f.since} ${dw(f.since)})`:""}</span>`:""}</dd></div>
      <div class="fact"><dt>Svetloba</dt><dd>${esc(p.svetloba)}</dd></div>
      ${p.posebno?`<div class="fact"><dt>Posebnosti</dt><dd>${esc(p.posebno)}</dd></div>`:""}
    </dl>
    ${p.softWater?`<p class="warn blue">Samo mehka voda: deževnica, prekuhana in ohlajena, ali odstana 24 ur. Vedno sobne temperature.</p>`:""}
    ${p.toxic?`<p class="warn">Strupena — sok draži kožo in sluznico. Izven dosega otrok in živali; po rezanju ali presajanju umij roke.</p>`:""}
    ${p.log&&p.log.length?`<h3 class="sec">Dnevnik</h3><div class="log">${p.log.slice(0,14).map(e=>`${pretty(e.d)} — ${e.k==="w"?(p.hydro?"menjana voda":"zalito"):"pognojeno"}`).join("<br>")}</div>`:""}
    <button class="btn danger" style="margin-top:26px" data-del="${p.id}">Odstrani iz zbirke</button>
  </div></div>`;
}

function plantForm(id){
  const p = id ? plants.find(x => x.id === id) : null;
  const v = (field, def="") => esc(p && p[field] != null ? p[field] : def);
  $("#modal").innerHTML = `<div class="veil" data-veil="1"><div class="sheet">
    <button class="close" data-close="1">Prekliči ✕</button>
    <h2 class="nm" style="font-size:23px;margin-bottom:18px">${p ? "Uredi rastlino" : "Nova rastlina"}</h2>
    <label class="lbl">Ime</label><input id="f-name" placeholder="npr. Fikus" value="${v("name")}">
    <label class="lbl">Latinsko ime</label><input id="f-latin" placeholder="Ficus elastica" value="${v("latin")}">
    <label class="lbl">Zanimivost / zgodba (neobvezno)</label><input id="f-tag" placeholder="Kratka zanimivost ali mit o rastlini" value="${v("zanimivost")}">
    <div style="display:flex;gap:10px">
      <div style="flex:1"><label class="lbl">Zalivanje poleti (dni)</label><input id="f-wg" type="number" value="${v("wg",7)}"></div>
      <div style="flex:1"><label class="lbl">Pozimi (dni)</label><input id="f-wr" type="number" value="${v("wr",12)}"></div>
    </div>
    <label class="lbl">Gnojenje na koliko dni (0 = nikoli)</label><input id="f-fd" type="number" value="${v("fd",21)}">
    <label class="lbl">Voda</label><input id="f-voda" placeholder="Kdaj in koliko zaliti" value="${v("voda")}">
    <label class="lbl">Zemlja</label><input id="f-zemlja" placeholder="Kakšen substrat" value="${v("zemlja")}">
    <label class="lbl">Gnojilo</label><input id="f-gnojilo" placeholder="Kakšno in kako pogosto" value="${v("gnojilo")}">
    <label class="lbl">Svetloba</label><input id="f-svetloba" value="${v("svetloba")}">
    <label class="lbl">Posebnosti</label><input id="f-posebno" value="${v("posebno")}">
    <button class="btn" id="f-save" data-edit-id="${id||""}" style="margin-top:8px">${p ? "Shrani spremembe" : "Dodaj v zbirko"}</button>
  </div></div>`;
}

function close(){ $("#modal").innerHTML = ""; pendingShot = null; }

function shrink(file, max = 560, q = 0.72){
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      res(c.toDataURL("image/jpeg", q));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("slika")); };
    img.src = url;
  });
}

function addStatus(id){
  const p = plants.find(x => x.id === id);
  if (!p) return;
  pendingShot = null;
  $("#modal").innerHTML = `<div class="veil" data-veil="1"><div class="sheet">
    <button class="close" data-close="1">Prekliči ✕</button>
    <h2 class="nm" style="font-size:23px;margin-bottom:14px">Nov status · ${esc(p.name)}</h2>
    <div id="status-pic"></div>
    <div style="display:flex;gap:8px;margin:10px 0 14px;flex-wrap:wrap">
      <button class="btn plain" data-cam-status="${p.id}">Fotografiraj</button>
      <button class="btn plain" data-shoot-status="${p.id}">Izberi datoteko</button>
    </div>
    <label class="lbl">Opažanje (neobvezno)</label>
    <textarea id="status-note" rows="4" placeholder="Kako kaže rastlina, kaj potrebuje ..."></textarea>
    <button class="btn" id="status-save" data-save-status="${p.id}" style="margin-top:6px" disabled>Shrani</button>
  </div></div>`;
}

function pickStatusPhoto(cam){
  const inp = document.createElement("input");
  inp.type = "file"; inp.accept = "image/*";
  if (cam) inp.capture = "environment";
  inp.onchange = async () => {
    const f = inp.files && inp.files[0];
    if (!f) return;
    try { pendingShot = await shrink(f); }
    catch(e){ alert("Slike ni bilo mogoče prebrati. Poskusi z drugo."); return; }
    const pic = $("#status-pic");
    if (pic) pic.innerHTML = `<img src="${pendingShot}" style="width:100%;max-height:220px;object-fit:cover;border-radius:3px;border:1px solid var(--line);display:block">`;
    const btn = $("#status-save");
    if (btn) btn.disabled = false;
  };
  inp.click();
}

function saveStatus(id){
  const p = plants.find(x => x.id === id);
  if (!p || !pendingShot) return;
  const note = $("#status-note").value.trim();
  const backup = p.photos ? [...p.photos] : [];
  p.photos = [{ d: today(), src: pendingShot, note: note || undefined }, ...backup].slice(0, 8);
  if (!save()) { p.photos = backup; alert("Shramba je polna. Izbriši nekaj starih fotografij, pa poskusi znova."); return; }
  pendingShot = null;
  render(); detail(id);
}

function dropShot(id, i){
  const p = plants.find(x => x.id === id);
  if (!p || !p.photos || !p.photos[i]) return;
  if (i === 0 && p.photos.length > 1) {
    if (!confirm("Izbrišem to fotografijo? Naslednja bo postala naslovna.")) return;
  } else if (!confirm("Izbrišem to fotografijo?")) return;
  p.photos.splice(i, 1);
  save(); render(); detail(id);
}

function log(id, kind){
  const p = plants.find(x => x.id === id);
  if (!p) return;
  const d = today();
  p.log = [{d, k: kind}, ...(p.log || [])].slice(0, 40);
  if (kind === "w") p.lastWater = d; else p.lastFert = d;
  save(); render();
  if ($(".sheet")) detail(id);
}

document.addEventListener("click", e => {
  const t = e.target.closest("[data-water],[data-feed],[data-open],[data-close],[data-veil],[data-del],[data-add],[data-edit],[data-status],[data-cam-status],[data-shoot-status],[data-save-status],[data-shot],#f-save");
  if (!t) return;

  if (t.dataset.water) { e.stopPropagation(); log(t.dataset.water, "w"); return; }
  if (t.dataset.feed)  { e.stopPropagation(); log(t.dataset.feed, "f"); return; }
  if (t.dataset.add)   { plantForm(null); return; }
  if (t.dataset.edit)  { e.stopPropagation(); plantForm(t.dataset.edit); return; }
  if (t.dataset.status)       { e.stopPropagation(); addStatus(t.dataset.status); return; }
  if (t.dataset.camStatus)    { pickStatusPhoto(true); return; }
  if (t.dataset.shootStatus)  { pickStatusPhoto(false); return; }
  if (t.dataset.saveStatus)   { saveStatus(t.dataset.saveStatus); return; }
  if (t.dataset.shot)  { const [pid, i] = t.dataset.shot.split("|"); dropShot(pid, +i); return; }
  if (t.dataset.del)   {
    if (confirm("Odstranim to rastlino iz zbirke?")) {
      plants = plants.filter(p => p.id !== t.dataset.del);
      save(); close(); render();
    }
    return;
  }
  if (t.id === "f-save") {
    const v = id => $("#f-"+id).value.trim();
    if (!v("name")) return;
    const data = {
      name: v("name"), latin: v("latin") || "—", zanimivost: v("tag"),
      wg: +$("#f-wg").value || 7, wr: +$("#f-wr").value || 12, fd: +$("#f-fd").value || 0,
      voda: v("voda") || "Zalij, ko sta zgornja 2–3 cm suha.",
      zemlja: v("zemlja") || "Univerzalna zemlja s perlitom, lonec z odtokom.",
      gnojilo: v("gnojilo") || "Univerzalno tekoče gnojilo v polovični dozi, april–september.",
      svetloba: v("svetloba") || "Svetlo, brez direktnega sonca.",
      posebno: v("posebno")
    };
    const editId = t.dataset.editId;
    if (editId) {
      const p = plants.find(x => x.id === editId);
      if (p) Object.assign(p, data);
    } else {
      plants.push({ id: "p" + Date.now(), log: [], ...data });
    }
    save(); close(); render();
    if (editId) detail(editId);
    return;
  }
  if (t.dataset.close || t.dataset.veil === "1") { close(); return; }
  if (t.dataset.open)  { detail(t.dataset.open); return; }
});

render();
</script>
</body>
</html>
